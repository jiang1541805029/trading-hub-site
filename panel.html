<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交易复盘 - Trading Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="css/style.css?v=20260909-1">
</head>
<body class="bg-[#f8fafc] text-slate-800 dark:bg-[#0b1120] dark:text-[#cbd5e1] min-h-screen lg:h-screen lg:overflow-hidden flex flex-col lg:flex-row text-sm">
  <aside class="w-full lg:w-[340px] lg:flex-shrink-0 bg-white dark:bg-[#151e32] border-b lg:border-b-0 lg:border-r border-gray-200 dark:border-slate-700 flex flex-col z-20 shadow-xl lg:overflow-y-auto">
    <div class="p-4 border-b border-gray-100 dark:border-slate-700 flex justify-between items-center sticky top-0 bg-white dark:bg-[#151e32] z-10">
      <h1 class="font-black text-sm tracking-tight flex items-center gap-2">TRADING HUB <span class="text-[9px] bg-green-600 text-white px-1.5 py-0.5 rounded">v35.1</span></h1>
      <div class="flex gap-2">
        <button onclick="exportData()" class="text-[10px] text-green-600 font-bold hover:underline">备份</button>
        <button onclick="document.getElementById('importFile').click()" class="text-[10px] text-yellow-600 font-bold hover:underline">恢复</button>
        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(this)">
      </div>
    </div>
    <div class="p-4 border-b border-gray-100 dark:border-slate-700 bg-white/80 dark:bg-[#0f172a]/50">
      <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">云端同步</div>
      <div class="flex items-center justify-between mt-2"><span id="authStatus" class="text-[10px] text-gray-400">未登录</span><button id="authLogoutBtn" onclick="signOut()" class="text-[10px] text-red-500 font-bold hidden">退出</button></div>
      <div id="syncStatus" class="text-[9px] text-gray-400 mt-1"></div>
    </div>
    <div class="p-4 border-b border-gray-100 dark:border-slate-700 bg-gray-50/50 dark:bg-[#0f172a]/50">
      <div class="flex justify-between items-end mb-2"><span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">盈利曲线</span><span id="totalPnL" class="text-xl font-black font-mono">$0.00</span></div>
      <div class="flex items-center justify-between mb-2 gap-2">
        <div class="flex gap-2"><button id="btnShowEquity" class="tiny-toggle" onclick="setChartMode('equity')">盈利</button><button id="btnShowWR" class="tiny-toggle" onclick="setChartMode('wr')">胜率</button><button id="btnShowBoth" class="tiny-toggle active" onclick="setChartMode('both')">同时</button></div>
        <select id="currencyFilter" class="bg-transparent text-[10px] font-bold text-purple-500 border-none outline-none cursor-pointer" onchange="applyGlobalFilter()"><option value="USD">美元</option><option value="CNY">人民币</option><option value="SGD">新加坡元</option></select>
      </div>
      <div class="flex items-center gap-1 mb-2"><span class="text-[9px] font-bold text-gray-400">日期</span><input type="date" id="filterStart" class="filter-date" onchange="applyGlobalFilter()"><span class="text-[9px] text-gray-400">~</span><input type="date" id="filterEnd" class="filter-date" onchange="applyGlobalFilter()"><button class="ml-auto text-[9px] text-blue-500 font-bold hover:underline" onclick="clearRangeFilter()">全部</button></div>
      <div class="h-48 w-full relative"><canvas id="equityChart"></canvas></div>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <div class="stat-card"><div class="stat-label">胜率</div><div class="text-base font-black text-blue-500" id="statWR">0%</div></div>
        <div class="stat-card"><div class="stat-label">交易数</div><div class="text-base font-black" id="statCount">0</div></div>
        <div class="stat-card"><div class="stat-label">平均盈利</div><div class="text-base font-black text-green-500" id="statAvgWin">$0</div></div>
        <div class="stat-card"><div class="stat-label">平均亏损</div><div class="text-base font-black text-red-500" id="statAvgLoss">$0</div></div>
      </div>
    </div>
    <div class="p-4 border-b border-gray-100 dark:border-slate-700">
      <div class="flex justify-between items-center mb-2">
        <div class="flex items-center gap-2"><button class="cal-btn text-gray-500" onclick="changeMonth(-1)">◀</button><div class="flex flex-col items-center"><span id="calMonth" class="text-[10px] font-bold"></span><span id="calMonthPnL" class="text-[9px] font-mono"></span></div><button class="cal-btn text-gray-500" onclick="changeMonth(1)">▶</button></div>
        <select id="calFilter" class="bg-transparent text-[10px] font-bold text-blue-500 border-none outline-none" onchange="applyGlobalFilter()"><option value="ALL">全部标的</option></select>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-[9px] text-gray-400 mb-1 font-bold"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
    </div>
    <div class="p-4 pb-8 flex-1"><h3 class="text-[10px] font-bold text-gray-500 uppercase mb-2">交易模式统计</h3><div id="stratStats" class="space-y-1"></div></div>
    <div class="mt-auto p-3 border-t border-gray-200 dark:border-slate-700 text-center sticky bottom-0 bg-white dark:bg-[#151e32]"><button onclick="toggleTheme()" class="text-[10px] font-bold text-gray-400">🌓 切换主题</button></div>
  </aside>

  <section id="formSection" class="w-full lg:w-[420px] lg:flex-shrink-0 bg-white dark:bg-[#1e293b] border-b lg:border-b-0 lg:border-r border-gray-200 dark:border-slate-700 flex flex-col z-10 shadow-xl relative">
    <div class="h-12 flex items-center px-4 border-b border-gray-100 dark:border-slate-700 justify-between"><h2 class="font-bold text-xs text-slate-800 dark:text-white" id="formTitle">✏️ 记录交易</h2><button id="cancelEditBtn" onclick="resetForm()" class="hidden text-[10px] text-red-500 font-bold">取消编辑</button></div>
    <form id="tradeForm" class="p-4 space-y-3 lg:flex-1 lg:overflow-y-auto pb-20">
      <input type="hidden" id="editId">
      <div class="grid grid-cols-2 gap-2.5">
        <div><label class="input-label">日期</label><input type="date" id="tradeDate" class="input-base cursor-pointer" required></div>
        <div><label class="input-label">标的</label><input type="text" id="ticker" list="tickList" class="input-base font-bold uppercase" placeholder="SPY" required><datalist id="tickList"><option value="MES"><option value="ES"><option value="MNQ"><option value="NQ"><option value="SPY"><option value="QQQ"><option value="BTC"><option value="ETH"><option value="XAUUSD"><option value="CL"></datalist></div>
      </div>
      <div><label class="input-label">订单类型</label><select id="orderType" class="input-base font-bold cursor-pointer" required><option value="止损单">止损单</option><option value="限价单">限价单</option><option value="市价单">市价单</option></select></div>
      <div class="grid grid-cols-2 gap-2.5">
        <div><label class="input-label">交易类型</label><select id="tradeCategory" class="input-base font-bold cursor-pointer" onchange="updatePatternOptions()" required></select></div>
        <div><label class="input-label">交易模式</label><select id="tradePattern" class="input-base font-bold cursor-pointer" required></select></div>
      </div>
      <div><label class="input-label">盈利</label><div class="flex gap-2"><input type="number" step="0.01" id="manualPnL" placeholder="亏损请输入负数" class="input-base font-black text-lg text-indigo-600 dark:text-indigo-400" required><select id="currency" class="input-base w-[120px] font-bold"><option value="USD">美元</option><option value="CNY">人民币</option><option value="SGD">新加坡元</option></select></div></div>
      <div><label class="input-label">交易截图（选填）</label><input type="text" id="snapshotId" class="input-base font-mono" placeholder="输入 TradingView 快照编号"></div>
      <div><label class="input-label">复盘</label><textarea id="review" class="input-base" placeholder="记录判断、执行和改进……"></textarea></div>
    </form>
    <div class="absolute bottom-0 w-full p-3 bg-white/95 dark:bg-[#1e293b]/95 backdrop-blur border-t border-gray-100 dark:border-slate-700 z-20"><button id="submitBtn" onclick="document.getElementById('tradeForm').requestSubmit()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold h-9 rounded shadow-md transition text-xs">保存交易</button></div>
  </section>

  <main class="flex-1 min-h-[500px] bg-gray-100 dark:bg-[#0b1120] flex flex-col lg:overflow-hidden relative">
    <div class="h-12 bg-white dark:bg-[#151e32] border-b border-gray-200 dark:border-slate-700 flex justify-between items-center px-5 shadow-sm shrink-0"><div class="flex items-center gap-3"><h3 class="text-xs font-bold text-gray-500">交易记录（<span id="recordCount">0</span>）</h3><input type="date" id="galleryFilterDate" class="hidden"><button onclick="clearDateFilter()" class="text-[10px] text-blue-500 font-bold">显示全部</button><span id="currentFilterDisplay" class="text-[10px] font-bold text-gray-400"></span></div><button onclick="clearAllData()" class="text-[10px] text-red-400">清空</button></div>
    <div id="galleryContainer" class="flex-1 lg:overflow-y-auto p-5 space-y-6"></div>
  </main>

  <div id="detailModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1e293b] w-full max-w-lg rounded-xl shadow-2xl p-6">
      <div class="flex justify-between items-start"><div><div id="mDate" class="text-xs text-gray-400 font-mono"></div><h2 id="mTicker" class="text-3xl font-black mt-1"></h2></div><button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-2xl">×</button></div>
      <div class="flex flex-wrap gap-2 mt-4"><span id="mOrderType" class="detail-tag"></span><span id="mTradeCategory" class="detail-tag"></span><span id="mTradePattern" class="detail-tag"></span></div>
      <div class="mt-5 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-lg"><div class="stat-label">盈利</div><div id="mPnL" class="font-mono font-black text-2xl"></div></div>
      <a id="mSnapshotLink" target="_blank" rel="noopener noreferrer" class="hidden mt-3 text-sm font-bold text-blue-500 hover:underline">查看 TradingView 交易截图 ↗</a>
      <div class="mt-5"><h4 class="text-[10px] font-bold text-gray-400 mb-1">复盘</h4><p id="mReview" class="text-sm leading-relaxed bg-gray-50 dark:bg-slate-800/30 p-3 rounded whitespace-pre-wrap min-h-[80px]"></p></div>
      <div class="mt-5 flex gap-2 border-t border-gray-100 dark:border-slate-700 pt-3"><button id="btnEdit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-xs">编辑</button><button id="btnDel" class="px-4 border border-red-500 text-red-500 rounded-lg font-bold text-xs">删除</button></div>
    </div>
  </div>
  <script src="js/app.js?v=20260909-2" defer></script>
</body>
</html>
